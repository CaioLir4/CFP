<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel CFP BM</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9;}
        nav { background-color: #ba1a1a; padding: 15px; color: white; display: flex; gap: 15px; }
        nav a { color: white; text-decoration: none; font-weight: bold; padding: 5px 10px; border-radius: 5px; transition: 0.3s;}
        nav a:hover { background-color: #901010; }
        .container { padding: 20px; max-width: 1000px; margin: auto; }
        table { border-collapse: collapse; width: 100%; margin-top: 15px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #ba1a1a; color: white; }
        h1, h2, h3 { color: #333; }
        .card { background-color: white; padding: 15px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px;}
    </style>
</head>
<body>
    <nav>
        <a href="/">Início</a>
        <a href="/alunos">Notas dos Alunos</a>
        <a href="/horas">Carga Horária</a>
        <a href="/financeiro">Financeiro</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
